on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: dotnet build src/DevilDaggersInfo.Core.slnx -c Release
      - name: Test
        run: dotnet test --solution src/DevilDaggersInfo.Core.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack src/DevilDaggersInfo.Core -c Release -o .
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        run: |
          dotnet nuget push *.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --skip-duplicate
